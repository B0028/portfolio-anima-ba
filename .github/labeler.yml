# .github/labeler.yml

# ==========================================
# EQUIPOS (sig/)
# ==========================================

"sig/frontend":
  - changed-files:
      - any-glob-to-any-file: '**/*.{css,scss,ts,tsx,js,jsx,html}'

"sig/backend":
  - changed-files:
      - any-glob-to-any-file: 'server/**/*'
      - any-glob-to-any-file: '**/*.{py,go,java,rb}'

"sig/devops":
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**/*'
      - any-glob-to-any-file: '**/docker/**/*'
      - any-glob-to-any-file: '**/Dockerfile'
      - any-glob-to-any-file: '**/docker-compose.yml'

# ==========================================
