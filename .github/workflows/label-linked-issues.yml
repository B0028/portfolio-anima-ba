name: "Auto Label Linked Issues by Files"

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main, master, develop] 

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  label-linked-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar Etiquetas por Archivos
        id: detect-labels
        uses: actions/labeler@v6.1.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false 
      - name: Transferir Etiquetas a las Issues Vinculadas
        uses: actions/github-script@v7
        with:
          script: |
            const detectedLabelsJson = '${{ steps.detect-labels.outputs.new-labels }}' || '[]';
            const labelsToAdd = JSON.parse(detectedLabelsJson);
            
            if (labelsToAdd.length === 0) {
              console.log("No se detectaron cambios que requieran etiquetas de labeler.yml");
              return;
            }
            
            console.log(`Etiquetas detectadas para aplicar: ${labelsToAdd}`);

            let commitMessages = "";
            
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              commitMessages = `${pr.title} ${pr.body} `;
              
              const commits = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              commitMessages += commits.data.map(c => c.commit.message).join(" ");
            } else {
              commitMessages = context.payload.commits.map(c => c.message).join(" ");
            }

            const issueRegex = /#(\d+)/g;
            const linkedIssues = [];
            let match;
            
            while ((match = issueRegex.exec(commitMessages)) !== null) {
              const issueNumber = parseInt(match[1], 10);
              if (!linkedIssues.includes(issueNumber)) {
                linkedIssues.push(issueNumber);
              }
            }

            if (linkedIssues.length === 0) {
              console.log("No se encontraron Issues vinculadas en los commits o descripción.");
              return;
            }

            console.log(`Issues vinculadas encontradas: ${linkedIssues}`);

            for (const issueNumber of linkedIssues) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labelsToAdd
                });
                console.log(`Etiquetas añadidas a la Issue #${issueNumber}`);
              } catch (error) {
                console.log(`No se pudieron añadir etiquetas a la Issue #${issueNumber}. Quizás no existe o es un PR.`);
              }
            }